# pytest configuration file

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Default options for test runs
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=api
    --cov=schemas
    --cov=models
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Test markers for organizing test execution
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (complete workflows)
    slow: Slow running tests
    auth: Authentication related tests
    workout: Workout endpoint tests
    feedback: Feedback endpoint tests
    media: Media upload tests

# Environment variables for testing
# Note: Tests use PostgreSQL (not SQLite) due to ARRAY types in models
# Set DATABASE_URL or TEST_DATABASE_URL in .env file
env = 
    DATABASE_URL=postgresql://test_user:test_pass@localhost:5432/test_gym_db
    SECRET_KEY=test_secret_key_for_testing_only
    ALGORITHM=HS256
    ACCESS_TOKEN_EXPIRE_MINUTES=30
