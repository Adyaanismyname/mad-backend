# pytest configuration file

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto

# Default options for test runs
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=api
    --cov=schemas
    --cov=models
    --cov=core
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Test markers for organizing test execution
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (multiple components)
    e2e: End-to-end tests (complete workflows)
    slow: Slow running tests
    auth: Authentication related tests
    workout: Workout endpoint tests
    feedback: Feedback endpoint tests
    media: Media upload tests
    s3_integration: S3 integration tests (requires real AWS credentials)

